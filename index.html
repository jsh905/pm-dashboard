<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM 협업 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0d0f;color:#f0f0f2;font-family:"DM Sans",sans-serif;font-size:14px;line-height:1.6;min-height:100vh;}
button{font-family:inherit;transition:all 0.15s;cursor:pointer;}
textarea,input,select{font-family:inherit;}
::-webkit-scrollbar{width:5px;} ::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid rgba(200,240,74,0.2);border-top-color:#c8f04a;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;}
</style>

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const SUPA_URL="https://kabokfrmiwnhhkmxkwoo.supabase.co";
const SUPA_KEY="sb_publishable_HjzKaCHMgSLjsGBu9hxPrw_Kbzu2Qo1";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

const C={bg:"#0d0d0f",bg2:"#141416",bg3:"#1a1a1e",bg4:"#222228",border:"rgba(255,255,255,0.07)",border2:"rgba(255,255,255,0.12)",text:"#f0f0f2",muted:"#8a8a99",faint:"#4a4a58",accent:"#c8f04a",accent2:"#7b6ef6",accent3:"#f06a6a",accent4:"#4af0c8"};
const PCOLS=["#c8f04a","#7b6ef6","#4af0c8","#f0c44a","#f06a6a","#e879f9","#38bdf8"];
const PHICONS=["📋","🎨","⚙️","🧪","🚀","📁","📌","🔧","💡","📊"];
const PHCOLS=["#c8f04a","#7b6ef6","#4af0c8","#f0c44a","#f06a6a"];
const statusMap={done:["rgba(200,240,74,0.1)","#c8f04a","완료"],progress:["rgba(123,110,246,0.1)","#7b6ef6","진행중"],todo:["rgba(255,255,255,0.05)","#4a4a58","예정"],block:["rgba(240,106,106,0.1)","#f06a6a","중단"]};
const Btn=(color=C.muted,bg="transparent",bdr=C.border2)=>({padding:"5px 14px",borderRadius:8,border:`1px solid ${bdr}`,background:bg,color,fontSize:12,cursor:"pointer"});
const bdg=(color,bg)=>({display:"inline-block",padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:bg,color,border:`1px solid ${color}44`});
const aColors=["#7b6ef6","#c8f04a","#f06a6a","#4af0c8","#f0c44a","#e879f9","#38bdf8"];
const nameColor=name=>aColors[Math.abs([...name].reduce((h,c)=>h*31+c.charCodeAt(0),0))%aColors.length];

function StatusPill({status}){
  const [bg,col,label]=statusMap[status]||statusMap.todo;
  return <span style={{padding:"2px 10px",borderRadius:20,fontSize:11,fontWeight:500,background:bg,color:col}}>{label}</span>;
}
function ConfirmModal({message,onConfirm,onCancel}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.bg3,border:`1px solid ${C.border2}`,borderRadius:16,padding:"2rem",maxWidth:380,width:"90%"}}>
        <div style={{fontSize:15,fontWeight:600,color:C.text,marginBottom:"0.75rem",fontFamily:"Epilogue,sans-serif"}}>확인</div>
        <div style={{fontSize:13,color:C.muted,lineHeight:1.8,marginBottom:"1.5rem"}} dangerouslySetInnerHTML={{__html:message}}/>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button onClick={onCancel} style={{...Btn(),padding:"8px 20px",fontSize:13}}>취소</button>
          <button onClick={onConfirm} style={{padding:"8px 20px",borderRadius:8,border:"none",background:C.accent3,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>확인</button>
        </div>
      </div>
    </div>
  );
}
function InlineInput({value,onChange,onConfirm,onCancel,placeholder="이름 입력",width=200}){
  return(
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <input autoFocus value={value} onChange={e=>onChange(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")onConfirm();if(e.key==="Escape")onCancel();}} placeholder={placeholder} style={{padding:"4px 10px",borderRadius:7,border:`1px solid ${C.accent}`,background:C.bg4,color:C.text,fontSize:12,outline:"none",width}}/>
      <button onClick={onConfirm} style={{padding:"4px 12px",borderRadius:7,border:"none",background:C.accent,color:"#0d0d0f",fontSize:11,fontWeight:700,cursor:"pointer"}}>확인</button>
      <button onClick={onCancel} style={{...Btn(),padding:"4px 10px",fontSize:11}}>취소</button>
    </div>
  );
}

/* ── 로그인 화면 ── */
function LoginScreen({onLogin}){
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const login=async()=>{
    if(!email.trim()||!pw.trim()){setError("이메일과 비밀번호를 입력해주세요.");return;}
    setLoading(true);setError("");
    const {data,error:err}=await sb.auth.signInWithPassword({email,password:pw});
    if(err){setError("이메일 또는 비밀번호가 올바르지 않아요.");setLoading(false);return;}
    onLogin(data.user);
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}>
      <div style={{width:360,background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:20,padding:"2.5rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"2rem"}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:C.accent,animation:"pulse 2s ease-in-out infinite"}}/>
          <span style={{fontFamily:"Epilogue,sans-serif",fontSize:18,fontWeight:800,color:C.text}}>PM 협업 대시보드</span>
        </div>
        <div style={{fontSize:13,color:C.muted,marginBottom:"1.5rem"}}>팀 계정으로 로그인하세요</div>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:"1rem"}}>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="이메일" style={{padding:"10px 14px",borderRadius:9,border:`1px solid ${C.border2}`,background:C.bg4,color:C.text,fontSize:13,outline:"none"}}/>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="비밀번호" style={{padding:"10px 14px",borderRadius:9,border:`1px solid ${C.border2}`,background:C.bg4,color:C.text,fontSize:13,outline:"none"}}/>
        </div>
        {error&&<div style={{fontSize:12,color:C.accent3,marginBottom:"0.75rem"}}>{error}</div>}
        <button onClick={login} disabled={loading} style={{width:"100%",padding:"11px",borderRadius:9,border:"none",background:C.accent,color:"#0d0d0f",fontSize:13,fontWeight:700,cursor:loading?"not-allowed":"pointer",opacity:loading?0.7:1}}>
          {loading?"로그인 중...":"로그인"}
        </button>
        <div style={{marginTop:"1.25rem",fontSize:12,color:C.faint,textAlign:"center"}}>계정이 없으신가요? PM에게 문의하세요.</div>
      </div>
    </div>
  );
}

/* ── 팀원 관리 패널 ── */
function TeamPanel({onClose}){
  const [members,setMembers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [adding,setAdding]=useState(false);
  const [form,setForm]=useState({email:"",name:"",role:"",team:"",is_pm:false,password:""});
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  useEffect(()=>{loadMembers();},[]);
  const loadMembers=async()=>{setLoading(true);const {data}=await sb.from("profiles").select("*").order("name");setMembers(data||[]);setLoading(false);};
  const addMember=async()=>{
    if(!form.email||!form.name||!form.role||!form.team||!form.password){setErr("모든 항목을 입력해주세요.");return;}
    setSaving(true);setErr("");
    const {data:authData,error:authErr}=await sb.auth.signUp({email:form.email,password:form.password});
    if(authErr){setErr("계정 생성 실패: "+authErr.message);setSaving(false);return;}
    const {error:profErr}=await sb.from("profiles").insert({id:authData.user.id,name:form.name,role:form.role,team:form.team,is_pm:form.is_pm});
    if(profErr){setErr("프로필 저장 실패: "+profErr.message);setSaving(false);return;}
    setForm({email:"",name:"",role:"",team:"",is_pm:false,password:""});setAdding(false);await loadMembers();setSaving(false);
  };
  const deleteMember=async(id)=>{await sb.from("profiles").delete().eq("id",id);await loadMembers();};
  const fs={padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border2}`,background:C.bg4,color:C.text,fontSize:12,outline:"none",width:"100%"};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.bg2,border:`1px solid ${C.border2}`,borderRadius:18,width:560,maxHeight:"80vh",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"1.25rem 1.5rem",borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontFamily:"Epilogue,sans-serif",fontSize:16,fontWeight:700,color:C.text}}>팀원 관리</div>
          <button onClick={onClose} style={{background:"transparent",border:"none",color:C.faint,fontSize:18,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{overflowY:"auto",padding:"1.25rem 1.5rem",flex:1}}>
          {loading?<div style={{color:C.muted,fontSize:13}}>불러오는 중...</div>:
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:"1.25rem"}}>
              {members.map(m=>(
                <div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:C.bg3,borderRadius:10,border:`1px solid ${C.border}`}}>
                  <div style={{width:32,height:32,borderRadius:"50%",background:C.accent+"22",color:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{m.name[0]}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:500,color:C.text,display:"flex",alignItems:"center",gap:6}}>{m.name}{m.is_pm&&<span style={bdg(C.accent,"rgba(200,240,74,0.1)")}>PM</span>}</div>
                    <div style={{fontSize:11,color:C.muted}}>{m.role} · {m.team}</div>
                  </div>
                  <button onClick={()=>deleteMember(m.id)} style={{background:"transparent",border:"none",color:C.faint,fontSize:13,cursor:"pointer"}}>✕</button>
                </div>
              ))}
              {members.length===0&&<div style={{fontSize:13,color:C.faint}}>등록된 팀원이 없어요.</div>}
            </div>}
          {adding?(
            <div style={{background:C.bg3,borderRadius:12,border:`1px solid ${C.border}`,padding:"1.25rem"}}>
              <div style={{fontSize:13,fontWeight:500,color:C.text,marginBottom:"1rem"}}>새 팀원 추가</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <input placeholder="이름" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} style={fs}/>
                <input placeholder="직무 (예: UX 디자이너)" value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))} style={fs}/>
                <input placeholder="팀 (예: 디자인팀)" value={form.team} onChange={e=>setForm(p=>({...p,team:e.target.value}))} style={fs}/>
                <input type="email" placeholder="이메일" value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))} style={fs}/>
                <input type="password" placeholder="초기 비밀번호" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))} style={fs}/>
                <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:C.muted,cursor:"pointer"}}><input type="checkbox" checked={form.is_pm} onChange={e=>setForm(p=>({...p,is_pm:e.target.checked}))}/>PM 권한 부여</label>
              </div>
              {err&&<div style={{fontSize:12,color:C.accent3,marginBottom:8}}>{err}</div>}
              <div style={{display:"flex",gap:8}}>
                <button onClick={addMember} disabled={saving} style={{...Btn(C.accent,"transparent",C.accent),padding:"6px 16px",fontWeight:600}}>{saving?"저장 중...":"추가"}</button>
                <button onClick={()=>{setAdding(false);setErr("");}} style={{...Btn(),padding:"6px 14px"}}>취소</button>
              </div>
            </div>
          ):(
            <button onClick={()=>setAdding(true)} style={{...Btn(C.accent,"transparent",C.accent),padding:"8px 18px",fontWeight:500,width:"100%"}}>+ 팀원 추가</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── 메모 패널 ── */
function MemoPanel({task,memo,isAssignee,onSave}){
  const [val,setVal]=useState(memo?.content||"");
  const [saving,setSaving]=useState(false);
  const timerRef=useRef(null);
  const ac=nameColor(task.profiles?.name||"?");
  const handleChange=e=>{
    if(!isAssignee)return;
    setVal(e.target.value);
    clearTimeout(timerRef.current);
    timerRef.current=setTimeout(async()=>{setSaving(true);await onSave(e.target.value);setSaving(false);},800);
  };
  return(
    <div style={{padding:"0 16px 12px 40px",borderBottom:`1px solid ${C.border}`,background:C.bg2}}>
      <div style={{borderTop:`1px dashed ${C.border2}`,paddingTop:10}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8}}>
          <div style={{width:20,height:20,borderRadius:"50%",background:ac+"22",color:ac,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>{(task.profiles?.name||"?")[0]}</div>
          <span style={{fontSize:11,fontWeight:500,color:C.muted}}>{task.profiles?.name||"미배정"}</span>
          <span style={{fontSize:11,color:C.faint}}>· {task.profiles?.role||""}</span>
          {saving&&<span style={{fontSize:11,color:C.faint,marginLeft:4}}>저장 중...</span>}
        </div>
        <div style={{marginLeft:27,background:C.bg3,border:`1px solid ${C.border2}`,borderRadius:"0 10px 10px 10px",padding:"8px 12px"}}>
          <textarea value={val} onChange={handleChange} readOnly={!isAssignee}
            placeholder={isAssignee?"이 작업에 대한 메모를 입력하세요...":"담당자("+task.profiles?.name+")만 메모를 작성할 수 있어요"}
            style={{display:"block",width:"100%",background:"transparent",border:"none",outline:"none",color:isAssignee?C.muted:C.faint,fontFamily:"inherit",fontSize:12,lineHeight:1.7,resize:"none",minHeight:32,cursor:isAssignee?"text":"default"}}/>
        </div>
      </div>
    </div>
  );
}

/* ── WBS 탭 ── */
function WBSTab({user,profile,isPm}){
  const [projects,setProjects]=useState([]);
  const [activePId,setActivePId]=useState(null);
  const [phases,setPhases]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [memos,setMemos]=useState({});
  const [loading,setLoading]=useState(true);
  const [openPhases,setOpenPhases]=useState(new Set());
  const [openMemos,setOpenMemos]=useState(new Set());
  const [confirmModal,setConfirmModal]=useState(null);
  const [addingProj,setAddingProj]=useState(false);
  const [newProjName,setNewProjName]=useState("");
  const [renamingProjId,setRenamingProjId]=useState(null);
  const [renameProjVal,setRenameProjVal]=useState("");
  const [addingPhase,setAddingPhase]=useState(false);
  const [newPhaseName,setNewPhaseName]=useState("");
  const [renamingPhId,setRenamingPhId]=useState(null);
  const [renamePhVal,setRenamePhVal]=useState("");
  const dragIdx=useRef(null);
  const [dragOver,setDragOver]=useState(null);

  useEffect(()=>{loadProjects();},[]);
  useEffect(()=>{if(activePId)loadPhases();},[activePId]);

  const loadProjects=async()=>{
    const {data}=await sb.from("projects").select("*").order("created_at");
    setProjects(data||[]);
    if(data&&data.length>0)setActivePId(data[0].id);
    else setLoading(false);
  };
  const loadPhases=async()=>{
    setLoading(true);
    const {data:phData}=await sb.from("phases").select("*").eq("project_id",activePId).order("order_idx");
    setPhases(phData||[]);
    if(phData&&phData.length>0){
      setOpenPhases(new Set(phData.slice(0,3).map(p=>p.id)));
      const phIds=phData.map(p=>p.id);
      const {data:tData}=await sb.from("tasks").select("*,profiles(name,role,team)").in("phase_id",phIds).order("order_idx");
      setTasks(tData||[]);
      if(tData&&tData.length>0){
        const {data:mData}=await sb.from("memos").select("*").in("task_id",tData.map(t=>t.id));
        const mMap={};(mData||[]).forEach(m=>{mMap[m.task_id]=m;});setMemos(mMap);
      }
    }
    setLoading(false);
  };

  const addProj=async()=>{
    if(!newProjName.trim()){setAddingProj(false);setNewProjName("");return;}
    const {data}=await sb.from("projects").insert({name:newProjName.trim(),color:PCOLS[projects.length%PCOLS.length]}).select().single();
    if(data){setProjects(prev=>[...prev,data]);setActivePId(data.id);}
    setNewProjName("");setAddingProj(false);
  };
  const startRenameProj=id=>{const p=projects.find(x=>x.id===id);setRenamingProjId(id);setRenameProjVal(p.name);};
  const confirmRenameProj=async()=>{
    if(!renameProjVal.trim()){setRenamingProjId(null);return;}
    await sb.from("projects").update({name:renameProjVal.trim()}).eq("id",renamingProjId);
    setProjects(prev=>prev.map(p=>p.id===renamingProjId?{...p,name:renameProjVal.trim()}:p));
    setRenamingProjId(null);
  };
  const deleteProj=id=>{
    if(projects.length<=1)return;
    setConfirmModal({message:"해당 프로젝트를 삭제하시겠습니까?<br/>프로젝트 안의 모든 카테고리와 작업이 삭제됩니다.",onConfirm:async()=>{
      await sb.from("projects").delete().eq("id",id);
      const next=projects.filter(p=>p.id!==id);setProjects(next);
      if(activePId===id)setActivePId(next[0]?.id||null);
      setConfirmModal(null);
    }});
  };

  const addPhase=async()=>{
    if(!newPhaseName.trim()){setAddingPhase(false);setNewPhaseName("");return;}
    const oi=phases.length;
    const {data}=await sb.from("phases").insert({project_id:activePId,title:`${oi+1}. ${newPhaseName.trim()}`,color:PHCOLS[oi%5],icon:PHICONS[oi%10],order_idx:oi}).select().single();
    if(data){setPhases(prev=>[...prev,data]);setOpenPhases(prev=>new Set([...prev,data.id]));}
    setNewPhaseName("");setAddingPhase(false);
  };
  const deletePhase=id=>setConfirmModal({message:"해당 카테고리를 삭제하시겠습니까?<br/>안에 들어있는 작업이 전부 삭제됩니다.",onConfirm:async()=>{
    await sb.from("phases").delete().eq("id",id);
    const updated=phases.filter(p=>p.id!==id).map((p,i)=>({...p,title:p.title.replace(/^\d+\.\s*/,`${i+1}. `),order_idx:i}));
    setPhases(updated);
    for(const p of updated)await sb.from("phases").update({order_idx:p.order_idx,title:p.title}).eq("id",p.id);
    setTasks(prev=>prev.filter(t=>t.phase_id!==id));setConfirmModal(null);
  }});
  const startRenamePh=id=>{const ph=phases.find(p=>p.id===id);setRenamingPhId(id);setRenamePhVal(ph.title.replace(/^\d+\.\s*/,""));};
  const confirmRenamePh=async()=>{
    if(!renamePhVal.trim()){setRenamingPhId(null);return;}
    const ph=phases.find(p=>p.id===renamingPhId);
    const newTitle=`${phases.indexOf(ph)+1}. ${renamePhVal.trim()}`;
    await sb.from("phases").update({title:newTitle}).eq("id",renamingPhId);
    setPhases(prev=>prev.map(p=>p.id===renamingPhId?{...p,title:newTitle}:p));setRenamingPhId(null);
  };

  const onDragStart=(e,idx)=>{dragIdx.current=idx;e.dataTransfer.effectAllowed="move";};
  const onDragOver=(e,idx)=>{e.preventDefault();if(dragIdx.current!==idx)setDragOver(idx);};
  const onDrop=async(e,toIdx)=>{
    e.preventDefault();const from=dragIdx.current;
    if(from==null||from===toIdx){setDragOver(null);return;}
    const next=[...phases];const[m]=next.splice(from,1);next.splice(toIdx,0,m);
    const updated=next.map((p,i)=>({...p,title:p.title.replace(/^\d+\.\s*/,`${i+1}. `),order_idx:i}));
    setPhases(updated);
    for(const p of updated)await sb.from("phases").update({order_idx:p.order_idx,title:p.title}).eq("id",p.id);
    dragIdx.current=null;setDragOver(null);
  };
  const onDragEnd=()=>{dragIdx.current=null;setDragOver(null);};

  const toggleDone=async(t)=>{
    const newDone=!t.is_done;
    const newStatus=newDone?"done":t.status==="done"?"todo":t.status;
    await sb.from("tasks").update({is_done:newDone,status:newStatus}).eq("id",t.id);
    setTasks(prev=>prev.map(x=>x.id===t.id?{...x,is_done:newDone,status:newStatus}:x));
  };
  const saveMemo=async(taskId,content)=>{
    const existing=memos[taskId];
    if(existing){
      await sb.from("memos").update({content,updated_at:new Date().toISOString()}).eq("id",existing.id);
      setMemos(prev=>({...prev,[taskId]:{...existing,content}}));
    } else {
      const {data}=await sb.from("memos").insert({task_id:taskId,author_id:user.id,content}).select().single();
      if(data)setMemos(prev=>({...prev,[taskId]:data}));
    }
  };

  const phaseTasks=ph=>tasks.filter(t=>t.phase_id===ph.id);
  const total=tasks.length,doneT=tasks.filter(t=>t.is_done).length;
  const progT=tasks.filter(t=>!t.is_done&&t.status==="progress").length;
  const blockT=tasks.filter(t=>!t.is_done&&t.status==="block").length;

  if(loading)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:300,gap:12,color:C.muted}}><span className="spinner"/>데이터 불러오는 중...</div>);

  return(
    <div>
      {confirmModal&&<ConfirmModal message={confirmModal.message} onConfirm={confirmModal.onConfirm} onCancel={()=>setConfirmModal(null)}/>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"1.25rem",flexWrap:"wrap",gap:8}}>
        <div style={{fontFamily:"Epilogue,sans-serif",fontSize:26,fontWeight:800,color:C.text,letterSpacing:"-0.02em"}}>WBS</div>
        <span style={bdg(C.accent4,"rgba(74,240,200,0.12)")}>진행중</span>
      </div>

      {/* 프로젝트 탭 */}
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:"1.5rem",flexWrap:"wrap",padding:"10px 14px",background:C.bg3,borderRadius:12,border:`1px solid ${C.border}`}}>
        <span style={{fontSize:11,color:C.faint,letterSpacing:"0.04em",textTransform:"uppercase",marginRight:4,flexShrink:0}}>프로젝트</span>
        {projects.map(proj=>
          renamingProjId===proj.id
            ? <InlineInput key={proj.id} value={renameProjVal} onChange={setRenameProjVal} onConfirm={confirmRenameProj} onCancel={()=>setRenamingProjId(null)} width={160}/>
            : <div key={proj.id} style={{display:"flex",alignItems:"center",borderRadius:8,overflow:"hidden",border:`1px solid ${activePId===proj.id?proj.color:C.border2}`}}>
                <button onClick={()=>setActivePId(proj.id)} style={{padding:"5px 12px",border:"none",background:activePId===proj.id?`${proj.color}18`:"transparent",color:activePId===proj.id?proj.color:C.muted,fontSize:12,fontWeight:activePId===proj.id?600:400,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:proj.color,flexShrink:0}}/>{proj.name}
                </button>
                {isPm&&<button onClick={()=>startRenameProj(proj.id)} style={{padding:"5px 7px",border:"none",borderLeft:`1px solid ${C.border}`,background:"transparent",color:C.faint,fontSize:11,cursor:"pointer"}}>✏</button>}
                {isPm&&projects.length>1&&<button onClick={()=>deleteProj(proj.id)} style={{padding:"5px 7px",border:"none",borderLeft:`1px solid ${C.border}`,background:"transparent",color:C.accent3,fontSize:11,cursor:"pointer"}}>✕</button>}
              </div>
        )}
        {isPm&&!addingProj&&<button onClick={()=>setAddingProj(true)} style={{...Btn(C.accent,"transparent",C.accent),padding:"5px 12px",fontWeight:500}}>+ 프로젝트 추가</button>}
        {isPm&&addingProj&&<InlineInput value={newProjName} onChange={setNewProjName} onConfirm={addProj} onCancel={()=>{setAddingProj(false);setNewProjName("");}} placeholder="프로젝트 이름 입력" width={180}/>}
        {projects.length===0&&!addingProj&&<span style={{fontSize:12,color:C.faint}}>프로젝트가 없어요. PM이 추가해주세요.</span>}
      </div>

      {/* 요약 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"0.75rem",marginBottom:"1.5rem"}}>
        {[["전체",total+"개",C.text],["완료",doneT+"개",C.accent],["진행중",progT+"개",C.accent2],["중단",blockT+"개",C.accent3],["완료율",total?Math.round(doneT/total*100)+"%":"0%",C.accent]].map(([l,v,c])=>(
          <div key={l} style={{background:C.bg3,border:`1px solid ${C.border}`,borderRadius:10,padding:"0.875rem 1.25rem"}}>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.04em",marginBottom:5}}>{l}</div>
            <div style={{fontFamily:"Epilogue,sans-serif",fontSize:22,fontWeight:700,color:c}}>{v}</div>
          </div>
        ))}
      </div>

      {/* 컨트롤 */}
      <div style={{display:"flex",gap:8,marginBottom:"1.25rem",alignItems:"center",flexWrap:"wrap"}}>
        <button onClick={()=>setOpenPhases(new Set(phases.map(p=>p.id)))} style={{...Btn(),padding:"6px 14px"}}>전체 펼치기</button>
        <button onClick={()=>setOpenPhases(new Set())} style={{...Btn(),padding:"6px 14px"}}>전체 접기</button>
        {isPm&&!addingPhase&&<button onClick={()=>setAddingPhase(true)} style={{...Btn(C.accent,"transparent",C.accent),padding:"6px 14px",fontWeight:500}}>+ 카테고리 추가</button>}
        {isPm&&addingPhase&&<InlineInput value={newPhaseName} onChange={setNewPhaseName} onConfirm={addPhase} onCancel={()=>{setAddingPhase(false);setNewPhaseName("");}} placeholder="카테고리 이름 입력" width={200}/>}
        <div style={{marginLeft:"auto",display:"flex",gap:12,alignItems:"center"}}>
          {[["#c8f04a","완료"],["#7b6ef6","진행중"],["#4a4a58","예정"],["#f06a6a","중단"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:C.muted}}><div style={{width:8,height:8,borderRadius:2,background:c}}/>{l}</div>
          ))}
        </div>
      </div>

      {/* 컬럼 헤더 */}
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 80px 80px 80px 36px",gap:12,padding:"8px 16px",fontSize:11,color:C.faint,letterSpacing:"0.04em",textTransform:"uppercase",borderBottom:`1px solid ${C.border}`,background:C.bg2,borderRadius:"8px 8px 0 0"}}>
        {["작업명","담당자","팀 / 직무","시작일","종료일","상태",""].map(h=><div key={h}>{h}</div>)}
      </div>

      {/* 페이즈 */}
      <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6}}>
        {phases.length===0&&<div style={{padding:"2rem",textAlign:"center",color:C.faint,fontSize:13}}>카테고리가 없어요. PM이 추가해주세요.</div>}
        {phases.map((phase,pIdx)=>{
          const pts=phaseTasks(phase);
          const pDone=pts.filter(t=>t.is_done).length;
          const pPct=pts.length?Math.round(pDone/pts.length*100):0;
          const isOpen=openPhases.has(phase.id);
          const isDO=dragOver===pIdx;
          return(
            <div key={phase.id} onDragOver={e=>onDragOver(e,pIdx)} onDrop={e=>onDrop(e,pIdx)} onDragEnd={onDragEnd}
              style={{borderRadius:12,overflow:"hidden",border:`1px solid ${isDO?C.accent:C.border}`,transition:"border-color 0.15s"}}>
              <div style={{background:C.bg3}}>
                <div onClick={()=>setOpenPhases(prev=>{const n=new Set(prev);n.has(phase.id)?n.delete(phase.id):n.add(phase.id);return n;})} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",cursor:"pointer",fontSize:13,fontWeight:500}}>
                  {isPm&&<div draggable onDragStart={e=>{e.stopPropagation();onDragStart(e,pIdx);}} onClick={e=>e.stopPropagation()} style={{color:C.faint,fontSize:16,cursor:"grab",flexShrink:0,userSelect:"none",padding:"2px 4px"}} title="드래그해서 순서 변경">⠿</div>}
                  <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
                    <span>{phase.icon}</span><span style={{color:C.text}}>{phase.title}</span>
                    <span style={{color:C.faint,fontSize:12,fontWeight:400}}>{pDone}/{pts.length}완료</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
                    <div style={{width:120,height:3,background:C.bg4,borderRadius:2,overflow:"hidden"}}><div style={{width:pPct+"%",height:"100%",background:phase.color,borderRadius:2,transition:"width 0.6s ease"}}/></div>
                    <div style={{color:C.muted,fontSize:12,minWidth:36,textAlign:"right"}}>{pPct}%</div>
                    <div style={{color:C.faint,fontSize:14,transition:"transform 0.2s",transform:isOpen?"rotate(180deg)":"rotate(0)"}}>▾</div>
                  </div>
                </div>
                {isPm&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 16px 8px 48px",borderTop:`1px solid ${C.border}`}} onClick={e=>e.stopPropagation()}>
                  {renamingPhId===phase.id
                    ?<InlineInput value={renamePhVal} onChange={setRenamePhVal} onConfirm={confirmRenamePh} onCancel={()=>setRenamingPhId(null)} width={180}/>
                    :<><button onClick={()=>startRenamePh(phase.id)} style={{...Btn(C.muted),padding:"3px 10px",fontSize:11}}>✏ 이름 변경</button>
                       <button onClick={()=>deletePhase(phase.id)} style={{...Btn(C.accent3,"transparent","rgba(240,106,106,0.3)"),padding:"3px 10px",fontSize:11}}>✕ 삭제</button></>}
                </div>}
              </div>
              {isOpen&&<div style={{background:C.bg2}}>
                {pts.length===0&&<div style={{padding:"1.5rem",textAlign:"center",color:C.faint,fontSize:13}}>작업이 없어요.</div>}
                {pts.map(t=>{
                  const ac=nameColor(t.profiles?.name||"?");
                  const hasMemo=!!(memos[t.id]?.content?.trim());
                  const isMO=openMemos.has(t.id);
                  const isAssignee=t.assignee_id===user.id;
                  return(
                    <div key={t.id}>
                      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 80px 80px 80px 36px",gap:12,alignItems:"center",padding:"10px 16px 10px 40px",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <div onClick={()=>(isAssignee||isPm)&&toggleDone(t)} style={{width:16,height:16,borderRadius:4,border:t.is_done?"none":`1.5px solid ${C.border2}`,background:t.is_done?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:(isAssignee||isPm)?"pointer":"default",opacity:(isAssignee||isPm)?1:0.5}}>
                            {t.is_done&&<span style={{fontSize:10,color:"#0d0d0f",fontWeight:700}}>✓</span>}
                          </div>
                          <span style={{color:t.is_done?C.faint:C.text,textDecoration:t.is_done?"line-through":"none"}}>{t.name}</span>
                        </div>
                        <div><div style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 8px",borderRadius:20,background:C.bg4,fontSize:11,color:C.muted}}>
                          <div style={{width:16,height:16,borderRadius:"50%",background:ac+"22",color:ac,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700}}>{(t.profiles?.name||"?")[0]}</div>
                          {t.profiles?.name||"미배정"}
                        </div></div>
                        <div><div style={{fontSize:12,color:C.text}}>{t.profiles?.team||""}</div><div style={{fontSize:11,color:C.faint,marginTop:2}}>{t.profiles?.role||""}</div></div>
                        <div style={{fontSize:12,color:C.muted}}>{t.start_date}</div>
                        <div style={{fontSize:12,color:C.muted}}>{t.end_date}</div>
                        <div><StatusPill status={t.is_done?"done":t.status}/></div>
                        <div style={{textAlign:"right"}}>
                          <button onClick={()=>setOpenMemos(prev=>{const n=new Set(prev);n.has(t.id)?n.delete(t.id):n.add(t.id);return n;})} title={hasMemo?"메모 있음":"메모 없음"} style={{background:"transparent",border:"none",color:hasMemo?C.accent:C.faint,fontSize:15,cursor:"pointer",padding:"2px 4px",borderRadius:4}}>🗒</button>
                        </div>
                      </div>
                      {isMO&&<MemoPanel task={t} memo={memos[t.id]} isAssignee={isAssignee} onSave={content=>saveMemo(t.id,content)}/>}
                    </div>
                  );
                })}
              </div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── 메인 앱 ── */
function App(){
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [isPm,setIsPm]=useState(false);
  const [showTeam,setShowTeam]=useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(session)loadProfile(session.user);
      else setAuthLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      if(session)loadProfile(session.user);
      else{setUser(null);setProfile(null);setIsPm(false);setAuthLoading(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const loadProfile=async(u)=>{
    const {data}=await sb.from("profiles").select("*").eq("id",u.id).single();
    setUser(u);setProfile(data);setIsPm(data?.is_pm||false);setAuthLoading(false);
  };

  if(authLoading)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}><span className="spinner"/></div>);
  if(!user)return <LoginScreen onLogin={u=>loadProfile(u)}/>;

  return(
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"DM Sans,sans-serif",fontSize:14,lineHeight:1.6}}>
      {showTeam&&isPm&&<TeamPanel onClose={()=>setShowTeam(false)}/>}
      <nav style={{position:"sticky",top:0,zIndex:100,background:"rgba(13,13,15,0.92)",backdropFilter:"blur(12px)",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 2rem",height:56}}>
        <div style={{display:"flex",alignItems:"center",gap:10,fontFamily:"Epilogue,sans-serif",fontSize:15,fontWeight:700,letterSpacing:"0.04em",color:C.text}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:C.accent,animation:"pulse 2s ease-in-out infinite"}}/>PM 협업 대시보드
        </div>
        <div style={{display:"flex",gap:2,background:C.bg3,borderRadius:10,padding:4,border:`1px solid ${C.border}`}}>
          <button style={{padding:"6px 18px",borderRadius:7,fontSize:13,fontWeight:500,color:C.text,background:C.bg4,border:"none",cursor:"pointer"}}>WBS</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {isPm&&<button onClick={()=>setShowTeam(true)} style={{...Btn(C.accent4,"transparent",C.accent4),padding:"5px 12px"}}>팀원 관리</button>}
          {isPm&&<button onClick={()=>setIsPm(p=>!p)} style={{padding:"5px 14px",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:600,border:`1px solid ${C.accent}`,background:"rgba(200,240,74,0.1)",color:C.accent}}>PM 편집 중 ●</button>}
          {!isPm&&profile?.is_pm&&<button onClick={()=>setIsPm(true)} style={{padding:"5px 14px",borderRadius:8,fontSize:12,cursor:"pointer",border:`1px solid ${C.border2}`,background:"transparent",color:C.muted}}>PM 편집 모드</button>}
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"4px 10px",background:C.bg3,borderRadius:8,border:`1px solid ${C.border}`}}>
            <div style={{width:20,height:20,borderRadius:"50%",background:C.accent+"22",color:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700}}>{profile?.name?.[0]||user.email[0].toUpperCase()}</div>
            <span style={{fontSize:12,color:C.muted}}>{profile?.name||user.email}</span>
          </div>
          <button onClick={()=>sb.auth.signOut()} style={{...Btn(),padding:"5px 12px",fontSize:12}}>로그아웃</button>
        </div>
      </nav>
      <div style={{maxWidth:1100,margin:"0 auto",padding:"2rem"}}>
        <WBSTab user={user} profile={profile} isPm={isPm}/>
      </div>
    </div>
  );
}

const container=document.getElementById("root");
const root=ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
</body>
</html>
